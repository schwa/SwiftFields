# Generated by: xcb ci generate
name: Xcode
on:
  push:
  pull_request:

jobs:
  build-example:
    runs-on: macos-26
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "generic/platform=iOS"
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Trust plugins
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - name: Build Example App (${{ matrix.destination }})
        run: |
          xcodebuild build \
            -project Demo/SwiftFieldsDemo.xcodeproj \
            -scheme SwiftFieldsDemo \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
